name: Build package

on:
  workflow_call:
    inputs:
      package:
        description: Package directory to build
        required: true
        type: string

jobs:
  build:
    name: Build (${{ inputs.package }})
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    permissions:
      contents: read
    steps:
      - name: Install tools
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed devtools git sudo
          systemd-machine-id-setup
          printf '%s\n' '#!/bin/bash' 'exec /usr/bin/systemd-nspawn --keep-unit "$@"' > /usr/local/bin/systemd-nspawn
          chmod 0755 /usr/local/bin/systemd-nspawn

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure build user
        shell: bash
        run: |
          useradd --create-home builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          sudo --user=builder --set-home "$GITHUB_WORKSPACE/build.sh" "$PACKAGE"

      - name: Upload package archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ inputs.package }}
          path: ${{ inputs.package }}/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1

      - name: Write build marker
        env:
          PACKAGE: ${{ inputs.package }}
        run: printf '%s\n' "$PACKAGE" > "$RUNNER_TEMP/package.txt"

      - name: Upload build marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-passed-${{ inputs.package }}
          path: ${{ runner.temp }}/package.txt
          retention-days: 1
