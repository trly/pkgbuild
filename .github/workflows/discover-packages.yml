name: Discover packages

on:
  workflow_call:
    inputs:
      base_sha:
        description: Base commit used to find changed package directories
        required: false
        type: string
        default: ''
      head_sha:
        description: Head commit used to find changed package directories
        required: false
        type: string
        default: ''
    outputs:
      packages:
        description: JSON array of changed package directories
        value: ${{ jobs.discover.outputs.packages }}

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Find changed packages
        id: find
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          empty_tree=$(git hash-object -t tree /dev/null)
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$empty_tree
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA=$empty_tree
          fi
          if [[ -z "$HEAD_SHA" ]]; then
            HEAD_SHA=HEAD
          fi

          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          rebuild_all=false
          for path in "${changed_files[@]}"; do
            case "$path" in
              build.sh|lint.sh|.github/workflows/test-packages.yml|.github/workflows/discover-packages.yml|.github/workflows/lint-package.yml|.github/workflows/build-package.yml|.github/workflows/validate-package.yml)
                rebuild_all=true
                break
                ;;
            esac
          done

          if [[ "$rebuild_all" == true ]]; then
            packages=$(
              for pkgbuild in */PKGBUILD; do
                [[ -f "$pkgbuild" ]] && printf '%s\n' "${pkgbuild%%/*}"
              done
            )
          else
            packages=$(
              for path in "${changed_files[@]}"; do
                package=${path%%/*}
                if [[ "$path" == */* && -f "$package/PKGBUILD" ]]; then
                  printf '%s\n' "$package"
                fi
              done | sort -u
            )
          fi

          packages=$(jq -R -s -c 'split("\n") | map(select(. != ""))' <<< "$packages")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
