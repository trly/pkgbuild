name: Lint package

on:
  workflow_call:
    inputs:
      package:
        description: Package directory to lint
        required: true
        type: string

jobs:
  lint:
    name: Lint (${{ inputs.package }})
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git namcap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check PKGBUILD
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          "$GITHUB_WORKSPACE/lint.sh" "$PACKAGE"

      - name: Write lint marker
        env:
          PACKAGE: ${{ inputs.package }}
        run: printf '%s\n' "$PACKAGE" > "$RUNNER_TEMP/package.txt"

      - name: Upload lint marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-passed-${{ inputs.package }}
          path: ${{ runner.temp }}/package.txt
          retention-days: 1
